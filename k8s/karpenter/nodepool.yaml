# NodePool — REGRAS de negócio do que o Karpenter pode provisionar.
# Aplicado no stage de deploy (CRD karpenter.sh/v1 já instalada pelo controller no addons).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        # SPOT primeiro (mais barato); cai pra on-demand se não houver SPOT.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Só amd64 — as imagens do ECR são amd64 (evita nó Graviton/arm64 quebrar pods).
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Famílias de uso geral/compute, geração recente — amplo (boa disponibilidade SPOT).
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        # Nós pequenos (2-4 vCPU): pods são minúsculos (50m), empacota melhor e custa menos.
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"]
      # Aponta pro EC2NodeClass que diz COMO o nó nasce na AWS.
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Recicla o nó após 30 dias (refresh de AMI/patches).
      expireAfter: 720h
  # Consolidação agressiva: remove nó vazio E junta nós subutilizados (economia máxima).
  # consolidateAfter espera 1min de ociosidade antes de agir (evita thrashing na demo).
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  # Teto de custo do NodePool — rede de segurança contra runaway.
  limits:
    cpu: "16"
