apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service-secrets
    creationPolicy: Owner
  # Um único Secret com os dois segredos do auth (mesmo pod consome ambos):
  #   DATABASE_URL  <- connection_string do RDS (togglemaster/rds/auth)
  #   MASTER_KEY    <- chave admin             (togglemaster/app/auth)
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/rds/auth
        property: connection_string
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/app/auth
        property: MASTER_KEY
