---
# Sincroniza DATABASE_URL do Secrets Manager para um Secret K8s
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-rds
  namespace: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service-rds-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: togglemaster/rds/auth
        property: connection_string
