apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # analytics escala por CPU: ao consumir mais mensagens da SQS, a CPU
          # sobe e o HPA adiciona réplicas (workaround sem KEDA — Opção A do desafio).
          averageUtilization: 70
