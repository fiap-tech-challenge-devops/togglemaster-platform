apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-sqs
  namespace: togglemaster
spec:
  podIdentity:
    provider: aws
---

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  scaleTargetRef:
    name: analytics-service
  minReplicaCount: 0
  maxReplicaCount: 5             
  pollingInterval: 20
  cooldownPeriod: 60
  # advanced:
  #   horizontalPodAutoscalerConfig:
  #     behavior:
  #       scaleUp:
  #         stabilizationWindowSeconds: 15   # rampa visível, mas fica atrás do HPA no eval demo
  #         policies:
  #           - type: Pods
  #             value: 3                       # +3 pods a cada 15s (0→10 em ~1min)
  #             periodSeconds: 15
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-sqs
      metadata:
        queueURL: "https://sqs.us-east-1.amazonaws.com/${AWS_ACCOUNT_ID}/togglemaster-evaluation-events"
        queueLength: "50"       
        awsRegion: "us-east-1"
        identityOwner: operator
