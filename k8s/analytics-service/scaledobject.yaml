---
# Diz ao KEDA COMO se autenticar na AWS: via IRSA (a role anotada no SA
# keda-operator). Sem secret/chave — o operator assume a role pelo OIDC do cluster.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-sqs
  namespace: togglemaster
spec:
  podIdentity:
    provider: aws
---
# Escala o analytics-service pela profundidade da fila SQS (0 -> N -> 0).
# Por baixo, o KEDA cria um HPA alimentado pela métrica da fila e gerencia
# ele mesmo a transição 0<->1 (que o HPA sozinho não faz).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  scaleTargetRef:
    name: analytics-service     # Deployment alvo
  minReplicaCount: 0            # scale-to-zero: fila vazia = 0 pods
  maxReplicaCount: 10
  pollingInterval: 20          # consulta a fila a cada 20s
  cooldownPeriod: 60           # 60s de fila vazia antes de voltar a 0
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-sqs     # usa o TriggerAuthentication acima
      metadata:
        # URL determinística (account+region+nome fixos) — estável entre apply/destroy.
        queueURL: "https://sqs.us-east-1.amazonaws.com/650687537445/togglemaster-evaluation-events"
        queueLength: "5"       # alvo de mensagens POR réplica -> replicas = ceil(msgs/5)
        awsRegion: "us-east-1"
        identityOwner: operator # usa a identidade do KEDA operator (não a do pod)
