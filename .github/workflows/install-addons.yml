name: EKS — Instalar Addons de Plataforma

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "Região AWS (ex: us-east-1)"
        required: true
        default: "us-east-1"
      cluster_name:
        description: "Nome do cluster EKS (output eks_cluster_name do Terraform)"
        required: true
        default: "eks-togglemaster"

jobs:
  install:
    name: Instalar Addons
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ inputs.aws_region }}
      CLUSTER_NAME: ${{ inputs.cluster_name }}

    steps:
      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.16.3"

      - name: Configurar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name   "$CLUSTER_NAME"

      - name: Verificar conectividade com o cluster
        run: kubectl get nodes -o wide

      # IRSA roles criadas pelo Terraform (platform_irsa.tf) — apenas resolver ARNs
      - name: Resolver ARNs das roles IRSA (Terraform)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          LBC_ROLE="${CLUSTER_NAME}-lbc-irsa"
          ESO_ROLE="${CLUSTER_NAME}-eso-irsa"

          aws iam get-role --role-name "$LBC_ROLE" >/dev/null
          aws iam get-role --role-name "$ESO_ROLE" >/dev/null

          echo "LBC_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/${LBC_ROLE}" >> "$GITHUB_ENV"
          echo "ESO_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/${ESO_ROLE}" >> "$GITHUB_ENV"
          echo "LBC IRSA: arn:aws:iam::${ACCOUNT_ID}:role/${LBC_ROLE}"
          echo "ESO IRSA: arn:aws:iam::${ACCOUNT_ID}:role/${ESO_ROLE}"

      - name: Adicionar Helm repo eks
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks

      - name: Instalar AWS Load Balancer Controller
        run: |
          VPC_ID=$(aws eks describe-cluster \
            --name "$CLUSTER_NAME" --region "$AWS_REGION" \
            --query "cluster.resourcesVpcConfig.vpcId" --output text)

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER_NAME" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn=$LBC_ROLE_ARN" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --atomic --wait --timeout 5m

      - name: Adicionar Helm repo external-secrets
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update external-secrets

      - name: Criar namespace external-secrets
        run: |
          kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -

      - name: Instalar External Secrets Operator
        run: |
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --set installCRDs=true \
            --set serviceAccount.create=true \
            --set serviceAccount.name=external-secrets \
            --set "serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn=$ESO_ROLE_ARN" \
            --atomic --wait --timeout 5m

      - name: Aplicar ClusterSecretStore
        run: |
          kubectl apply -f - <<EOF
          apiVersion: external-secrets.io/v1beta1
          kind: ClusterSecretStore
          metadata:
            name: aws-secrets-manager
          spec:
            provider:
              aws:
                service: SecretsManager
                region: ${AWS_REGION}
                auth:
                  jwt:
                    serviceAccountRef:
                      name: external-secrets
                      namespace: external-secrets
          EOF

      - name: Adicionar Helm repo metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update metrics-server

      - name: Instalar metrics-server
        run: |
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set args[0]="--kubelet-insecure-tls" \
            --atomic --wait --timeout 3m

      - name: Validar AWS Load Balancer Controller
        run: |
          kubectl rollout status deployment/aws-load-balancer-controller \
            -n kube-system --timeout=120s
          kubectl get pods -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller

      - name: Validar External Secrets Operator
        run: |
          kubectl rollout status deployment/external-secrets \
            -n external-secrets --timeout=120s
          kubectl get pods -n external-secrets

      - name: Validar IngressClass ALB
        run: kubectl get ingressclass alb

      - name: Validar ClusterSecretStore
        run: |
          for i in $(seq 1 12); do
            STATUS=$(kubectl get clustersecretstore aws-secrets-manager \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
            if [ "$STATUS" = "True" ]; then
              echo "ClusterSecretStore: Ready"
              break
            fi
            echo "Aguardando ClusterSecretStore ficar Ready... (${i}/12)"
            sleep 5
          done
          kubectl get clustersecretstore aws-secrets-manager -o wide

      - name: Validar metrics-server
        run: |
          kubectl rollout status deployment/metrics-server \
            -n kube-system --timeout=60s
          kubectl top nodes

      - name: Resumo da instalação
        if: always()
        run: |
          echo "============================================================"
          echo " INSTALACAO — ToggleMaster Platform Addons"
          echo " Cluster : $CLUSTER_NAME"
          echo " Regiao  : $AWS_REGION"
          echo "============================================================"
          echo ""
          echo "Addons instalados (Helm/kubectl):"
          echo "  - AWS Load Balancer Controller  (kube-system)"
          echo "  - External Secrets Operator      (external-secrets)"
          echo "  - ClusterSecretStore             aws-secrets-manager"
          echo "  - IngressClass ALB               (chart LBC)"
          echo "  - metrics-server                 (kube-system)"
          echo ""
          echo "IRSA (Terraform platform_irsa.tf):"
          echo "  - ${CLUSTER_NAME}-lbc-irsa"
          echo "  - ${CLUSTER_NAME}-eso-irsa"
