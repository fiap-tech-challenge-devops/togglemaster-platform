name: IaC — Destroy (addons → infra)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "DESTROY" para confirmar'
        type: string
        required: true
      region:
        description: "Região AWS"
        type: string
        default: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region }}
  TF_IN_AUTOMATION: "true"

jobs:
  guard:
    name: Confirmar
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Abortado: confirm deve ser exatamente DESTROY."
            exit 1
          fi

  delete-apps:
    name: Stage 3 — delete apps
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - name: Remover recursos k8s e drenar nodes
        run: |
          CLUSTER=$(aws ssm get-parameter --name /togglemaster/iac/cluster-name \
            --query Parameter.Value --output text 2>/dev/null || true)

          if [ -z "$CLUSTER" ] || [ "$CLUSTER" == "None" ]; then
            echo "Cluster não encontrado no SSM — pulando remoção de recursos k8s."
          else
            aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

            # ORDEM IMPORTA: o ALB Controller precisa estar VIVO para deletar o ALB
            # na AWS e remover o finalizer do Ingress. Por isso deletamos o Ingress
            # e esperamos o ALB sumir ANTES de drenar os nodes (o drain mata o
            # controller, deixando o ALB órfão e o Ingress preso no finalizer).

            # 1) Deleta o Ingress (--wait=false: o finalizer só sai quando o ALB for
            #    removido; esperamos isso no loop abaixo, não aqui)
            kubectl delete ingress togglemaster -n togglemaster \
              --ignore-not-found --wait=false

            # 2) Espera o ALB ser removido da AWS (controller ainda ativo, até 5 min)
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:System,Values=togglemaster" \
              --query "Vpcs[0].VpcId" --output text 2>/dev/null || true)
            if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
              echo "Aguardando remoção do ALB na VPC $VPC_ID..."
              for i in $(seq 1 30); do
                LBS=$(aws elbv2 describe-load-balancers \
                  --query "LoadBalancers[?VpcId=='${VPC_ID}'].LoadBalancerArn" \
                  --output text 2>/dev/null)
                if [ -z "$LBS" ]; then
                  echo "ALB removido. Prosseguindo."
                  break
                fi
                echo "ALB ainda existe ($i/30), aguardando 10s..."
                sleep 10
              done
            fi

            # 3) Deleta o namespace (já sem o ALB pendente)
            kubectl delete namespace togglemaster \
              --ignore-not-found --wait=true --timeout=120s || true

            # 4) AGORA drena os nodes: vpc-cni libera as ENIs secundárias antes do
            #    Terraform terminar as instâncias. --disable-eviction usa DELETE
            #    direto (ignora PodDisruptionBudgets) — num cluster de 1 node o
            #    CoreDNS não evictaria via PDB e travaria o drain.
            for NODE in $(kubectl get nodes -o name 2>/dev/null); do
              echo "Drenando $NODE..."
              kubectl drain "$NODE" \
                --ignore-daemonsets --delete-emptydir-data --force \
                --disable-eviction --timeout=90s || true
            done
          fi

  destroy-addons:
    name: Stage 2 — destroy addons
    runs-on: ubuntu-latest
    needs: delete-apps
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/addons
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform destroy
        working-directory: iac/addons
        run: terraform destroy -input=false -auto-approve

  destroy-infra:
    name: Stage 1 — destroy infra
    runs-on: ubuntu-latest
    needs: destroy-addons
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Limpar SGs órfãos do EKS
        run: |
          # O EKS cria um cluster SG extra que não é gerenciado pelo Terraform.
          # Se não for deletado antes, bloqueia a deleção da VPC.
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:System,Values=togglemaster" \
            --query "Vpcs[0].VpcId" --output text 2>/dev/null || true)
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            SGS=$(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=${VPC_ID}" "Name=group-name,Values=eks-cluster-sg-*" \
              --query "SecurityGroups[*].GroupId" --output text 2>/dev/null)
            for SG in $SGS; do
              echo "Deletando SG órfão do EKS: $SG"
              aws ec2 delete-security-group --group-id "$SG" || true
            done
          fi

      - name: Terraform destroy
        working-directory: iac/infra
        run: terraform destroy -input=false -auto-approve
