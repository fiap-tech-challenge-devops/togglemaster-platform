name: IaC — Destroy (addons → infra)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "DESTROY" para confirmar'
        type: string
        required: true
      region:
        description: "Região AWS"
        type: string
        default: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region }}
  TF_IN_AUTOMATION: "true"

jobs:
  guard:
    name: Confirmar
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Abortado: confirm deve ser exatamente DESTROY."
            exit 1
          fi

  destroy-addons:
    name: Stage 2 — destroy addons
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/addons
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform destroy
        working-directory: iac/addons
        run: terraform destroy -input=false -auto-approve

  destroy-infra:
    name: Stage 1 — destroy infra
    runs-on: ubuntu-latest
    needs: destroy-addons
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform destroy
        working-directory: iac/infra
        run: terraform destroy -input=false -auto-approve
