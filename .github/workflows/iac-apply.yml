name: IaC — Apply (infra → addons)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (só mostra) ou apply (cria/atualiza)"
        type: choice
        options: [plan, apply]
        default: plan
      region:
        description: "Região AWS"
        type: string
        default: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region }}
  TF_IN_AUTOMATION: "true"

jobs:
  infra:
    name: Stage 1 — infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform plan
        working-directory: iac/infra
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: iac/infra
        run: terraform apply -input=false -auto-approve tfplan

  addons:
    name: Stage 2 — addons
    runs-on: ubuntu-latest
    needs: infra
    if: ${{ inputs.action == 'apply' }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/addons
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform apply
        working-directory: iac/addons
        run: terraform apply -input=false -auto-approve
