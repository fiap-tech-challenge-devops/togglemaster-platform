name: IaC — Apply (infra → addons)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (só mostra) ou apply (cria/atualiza)"
        type: choice
        options: [plan, apply]
        default: plan
      region:
        description: "Região AWS"
        type: string
        default: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region }}
  TF_IN_AUTOMATION: "true"

jobs:
  infra:
    name: Stage 1 — infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform plan
        working-directory: iac/infra
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: iac/infra
        run: terraform apply -input=false -auto-approve tfplan

  addons:
    name: Stage 2 — addons
    runs-on: ubuntu-latest
    needs: infra
    if: ${{ inputs.action == 'apply' }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=togglemaster-iac-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: iac/addons
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=togglemaster-iac-tflock"

      - name: Terraform apply
        working-directory: iac/addons
        run: terraform apply -input=false -auto-approve

  deploy:
    name: Stage 3 — deploy apps
    runs-on: ubuntu-latest
    needs: addons
    if: ${{ inputs.action == 'apply' }}
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - name: Configurar kubeconfig
        run: |
          CLUSTER=$(aws ssm get-parameter --name /togglemaster/iac/cluster-name \
            --query Parameter.Value --output text)
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: kubectl apply
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ --recursive

      - name: Rodar migrations de banco (idempotente)
        run: |
          migrate() {
            local NAME=$1 SECRET=$2 SQL_FILE=$3
            echo "Migrando $NAME..."
            URL=$(aws secretsmanager get-secret-value --secret-id "$SECRET" \
              --query SecretString --output text | jq -r '.connection_string')
            POD="migrate-${NAME}"
            kubectl run "$POD" --image=postgres:16 --restart=Never \
              -n togglemaster -- sleep 120
            kubectl wait pod/"$POD" -n togglemaster \
              --for=condition=Ready --timeout=30s
            cat "$SQL_FILE" | kubectl exec -i "$POD" -n togglemaster -- psql "$URL"
            kubectl delete pod "$POD" -n togglemaster --ignore-not-found
          }

          migrate auth      togglemaster/rds/auth      k8s/migrations/auth.sql
          migrate flags     togglemaster/rds/flags     k8s/migrations/flags.sql
          migrate targeting togglemaster/rds/targeting k8s/migrations/targeting.sql

      - name: Bootstrap SERVICE_API_KEY
        run: |
          # Garante auth-service pronto (preciso dele de pé para validar/gerar key)
          kubectl wait externalsecret/auth-service-app -n togglemaster \
            --for=condition=Ready --timeout=60s
          kubectl rollout restart deployment/auth-service -n togglemaster
          kubectl rollout status deployment/auth-service -n togglemaster --timeout=180s

          # Port-forward para o runner acessar o auth-service diretamente
          kubectl port-forward svc/auth-service 8001:8001 -n togglemaster &
          PF_PID=$!
          sleep 5

          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id togglemaster/app/evaluation \
            --query SecretString --output text | jq -r '.SERVICE_API_KEY')

          # Valida a key ATUAL contra o auth-service. Regenera se for placeholder
          # OU inválida: o secret do SM persiste entre destroy/apply, mas num apply
          # limpo o RDS do auth é recriado, deixando a key antiga órfã (401).
          VALID="false"
          if [[ "$CURRENT" != placeholder* && -n "$CURRENT" && "$CURRENT" != "null" ]]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8001/validate -H "Authorization: Bearer $CURRENT")
            [[ "$CODE" == "200" ]] && VALID="true"
          fi

          if [[ "$VALID" == "true" ]]; then
            echo "SERVICE_API_KEY válida — pulando."
            kill $PF_PID || true
          else
            echo "SERVICE_API_KEY ausente/inválida — gerando nova via auth-service..."
            MASTER_KEY=$(aws secretsmanager get-secret-value \
              --secret-id togglemaster/app/auth \
              --query SecretString --output text | jq -r '.MASTER_KEY')

            API_KEY=$(curl -sf -X POST http://localhost:8001/admin/keys \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $MASTER_KEY" \
              -d '{"name":"evaluation-service"}' | jq -r '.key')

            kill $PF_PID || true

            if [[ -z "$API_KEY" || "$API_KEY" == "null" ]]; then
              echo "Falha ao gerar API key — verifique o auth-service" && exit 1
            fi

            aws secretsmanager put-secret-value \
              --secret-id togglemaster/app/evaluation \
              --secret-string "{\"SERVICE_API_KEY\":\"${API_KEY}\"}"

            # Força ESO a recriar o secret k8s com o valor real
            kubectl delete secret evaluation-service-secrets -n togglemaster --ignore-not-found
            sleep 15
            echo "SERVICE_API_KEY gerada e sincronizada."
          fi

      - name: Injetar REDIS_URL (do SSM) no ConfigMap
        run: |
          REDIS_URL=$(aws ssm get-parameter --name /togglemaster/iac/redis-url \
            --query Parameter.Value --output text)
          kubectl patch configmap togglemaster-common -n togglemaster --type merge \
            -p "{\"data\":{\"REDIS_URL\":\"${REDIS_URL}\"}}"

      - name: Reiniciar serviços
        run: |
          # Aguarda todos os ExternalSecrets sincronizarem antes de reiniciar
          kubectl wait externalsecret --all -n togglemaster \
            --for=condition=Ready --timeout=90s
          # Garante que todos os pods recarregam ConfigMap e secrets atualizados
          kubectl rollout restart deployment/auth-service -n togglemaster
          kubectl rollout restart deployment/evaluation-service -n togglemaster
          kubectl rollout restart deployment/flag-service -n togglemaster
          kubectl rollout restart deployment/targeting-service -n togglemaster
          kubectl rollout status deployment/auth-service -n togglemaster --timeout=120s
          kubectl rollout status deployment/evaluation-service -n togglemaster --timeout=120s
          kubectl rollout status deployment/flag-service -n togglemaster --timeout=120s
          kubectl rollout status deployment/targeting-service -n togglemaster --timeout=120s
